name: Build unsigned iOS app

on:
  workflow_dispatch:
    inputs:
      bundle_identifier:
        description: "Your own iOS bundle identifier (for example, com.yourname.openwhispr)"
        required: true
        type: string

permissions:
  contents: read

env:
  CI: "true"
  EXPO_NO_DOTENV: "1"
  EXPO_NO_TELEMETRY: "1"
  SENTRY_DISABLE_AUTO_UPLOAD: "true"
  OPENWHISPR_APP_ENV: production
  OPENWHISPR_UNSIGNED_IOS_BUILD: "1"

jobs:
  build:
    name: Unsigned iOS archive and IPA
    runs-on: macos-26
    timeout-minutes: 120
    env:
      OPENWHISPR_IOS_BUNDLE_IDENTIFIER: ${{ inputs.bundle_identifier }}
      IOS_UNSIGNED_OUTPUT_DIR: ${{ runner.temp }}/ios-unsigned
    defaults:
      run:
        shell: bash
        working-directory: openwhispr-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # This version is listed on the macos-26 runner image. Fail if removed
      # instead of silently using the image's changing default Xcode.
      # AppleLLMModule also uses the iOS 26.4 token-counting SDK API.
      - name: Select and verify Xcode 26.4.1
        run: |
          test -d /Applications/Xcode_26.4.1.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.4.1"
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: openwhispr-mobile/.nvmrc
          cache: npm
          cache-dependency-path: openwhispr-mobile/package-lock.json
      - name: Check unsigned build configuration and artifact validation
        working-directory: .
        run: |
          node --test openwhispr-mobile/scripts/__tests__/unsigned-ios-config.test.js
          python3 -m unittest discover -s test/scripts -p 'ios_*test.py'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply reviewed dependency patches
        run: node_modules/.bin/patch-package --error-on-fail
      - name: Verify patched signing dependency
        run: npm run test:security

      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.3.11"
          bundler: "2.4.14" # openwhispr-mobile/Gemfile.lock
          working-directory: openwhispr-mobile
          bundler-cache: false
      - name: Install locked CocoaPods and SPM tooling
        run: |
          bundle lock --add-platform "$(ruby -e 'print Gem::Platform.local')"
          bundle install --jobs 4 --retry 3

      # The script owns prebuild, pod install, unsigned device compilation and
      # packaging. No Apple account, signing certificate or EAS login is used.
      - name: Build unsigned archive and IPA
        working-directory: .
        run: bash scripts/build-ios-unsigned.sh --output-dir "$IOS_UNSIGNED_OUTPUT_DIR"

      - name: Upload unsigned app and signing metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-unsigned/OpenWhispr-unsigned.ipa
            ${{ runner.temp }}/ios-unsigned/OpenWhispr-unsigned.xcarchive.zip
            ${{ runner.temp }}/ios-unsigned/entitlements.json
            ${{ runner.temp }}/ios-unsigned/build-info.json
            ${{ runner.temp }}/ios-unsigned/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload native build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-unsigned-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-unsigned/logs/
          if-no-files-found: ignore
          retention-days: 7
