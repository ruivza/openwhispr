name: Build tagged packages (unsigned)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 1.10.3); signing is performed locally"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Build tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

  build:
    needs: validate-version
    uses: ./.github/workflows/build-and-notarize.yml
    secrets: inherit
