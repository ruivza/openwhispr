# name: Publish Windows and Linux packages
name: Publish Windows packages

on:
  workflow_run:
    workflows: ["Build tagged packages (unsigned)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful tagged build run ID"
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-packages-${{ inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    # Original guard accepted any repository; this fork must not publish upstream.
    # github.event_name == 'workflow_dispatch' || (successful same-repository tag push)
    if: >-
      github.repository == 'ruivza/openwhispr' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check publishing logic
        run: python3 -m unittest discover -s .github/scripts -p 'test_publish_packages.py'
      # - name: Publish unsigned Windows and Linux packages
      - name: Publish unsigned Windows packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: python3 .github/scripts/publish-packages.py
