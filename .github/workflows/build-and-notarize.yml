name: Build unsigned packages

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - "openwhispr-mobile/**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    permissions:
      contents: read

  quality:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ github.event_name != 'pull_request' || (github.base_ref == 'main' && needs.changes.outputs.build == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run quality checks
        run: npm run quality-check
      - name: Check translations
        run: npm run i18n:check
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check local release tooling
        run: |
          bash -n scripts/release-local.sh
          python3 -m unittest discover -s test/scripts -p 'macos_release_test.py'
      - name: Build better-sqlite3 for the runner's node
        # --ignore-scripts skips the native build; DB-backed tests silently
        # skip without it. This job is the only test gate on push to main.
        # Guarded like the test step below, or the rebuild is skipped and the
        # suite then fails REQUIRE_DB_TESTS on a missing binding instead.
        if: ${{ !cancelled() }}
        run: npm rebuild better-sqlite3
      - name: Run tests
        # The gates above fail on drift that has nothing to do with the suite —
        # a stray format nit, a missing locale key, a fresh advisory. Without
        # this, main goes untested for as long as the drift stands (#1735).
        if: ${{ !cancelled() }}
        run: npm test
        env:
          # keeps require("electron") from throwing when postinstall was skipped
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
          # a skipped DB test here means the rebuild step above is gone: fail instead
          REQUIRE_DB_TESTS: "1"

  build-linux:
    needs: quality
    # Linux packages are no longer supported by this fork.
    # if: needs.quality.outputs.build == 'true'
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install platform-specific native binaries
        run: npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: linux-x64-bin-${{ hashFiles('scripts/download-*.js') }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: linux-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-electron-

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libx11-dev libxtst-dev libatspi2.0-dev libglib2.0-dev libpipewire-0.3-dev pkg-config

      - name: Create runtime env
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env
          echo "SLACK_CLIENT_ID=${{ secrets.SLACK_CLIENT_ID }}" >> .env
          echo "LINEAR_CLIENT_ID=${{ secrets.LINEAR_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_CLIENT_ID=${{ secrets.GH_APP_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_SLUG=${{ secrets.GH_APP_SLUG }}" >> .env

      - name: Verify PipeWire system audio helper build
        run: |
          npm run compile:linux-system-audio
          # supportsNativeCapture reflects compile-time PipeWire linkage, so this passes on CI runners with no PipeWire daemon (where "ok" is false).
          resources/bin/linux-system-audio-helper probe | grep '"supportsNativeCapture":true'

      - name: Build Application
        run: npm run build:linux -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          # Forks and Dependabot get no GH_TOKEN; github.token can't read the private font release.
          BRAND_FONTS_REQUIRED: ${{ secrets.GH_TOKEN && '1' || '0' }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.openwhispr.com' }}
          VITE_OPENWHISPR_API_URL: ${{ vars.VITE_OPENWHISPR_API_URL }}
          VITE_OPENWHISPR_OAUTH_CALLBACK_URL: ${{ vars.VITE_OPENWHISPR_OAUTH_CALLBACK_URL }}

      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: dist/
          retention-days: 7

  build-windows:
    needs: quality
    if: needs.quality.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: Install platform-specific native binaries
        run: npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          # Native helper sources are in the key so source changes cannot
          # restore stale helper binaries from the cache.
          key: windows-x64-bin-${{ hashFiles('scripts/download-*.js', 'resources/windows-system-audio-helper.c', 'resources/windows-mic-listener.c') }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download nircmd.exe
        run: node scripts/download-nircmd.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download windows-fast-paste.exe
        run: node scripts/download-windows-fast-paste.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Compile windows-mic-listener.exe
        shell: cmd
        run: |
          if not exist resources\bin mkdir resources\bin
          cl /O2 /nologo resources\windows-mic-listener.c /Fe:resources\bin\windows-mic-listener.exe ole32.lib oleaut32.lib

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: windows-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: windows-electron-

      - name: Create runtime env
        shell: bash
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env
          echo "SLACK_CLIENT_ID=${{ secrets.SLACK_CLIENT_ID }}" >> .env
          echo "LINEAR_CLIENT_ID=${{ secrets.LINEAR_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_CLIENT_ID=${{ secrets.GH_APP_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_SLUG=${{ secrets.GH_APP_SLUG }}" >> .env

      - name: Build unsigned Windows installer
        run: npm run build:win -- --publish never --config electron-builder.unsigned-win.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.openwhispr.com' }}
          VITE_OPENWHISPR_API_URL: ${{ vars.VITE_OPENWHISPR_API_URL }}
          VITE_OPENWHISPR_OAUTH_CALLBACK_URL: ${{ vars.VITE_OPENWHISPR_OAUTH_CALLBACK_URL }}

      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-build
          path: dist/
          retention-days: 7

      - name: Verify packaged Windows startup
        run: node scripts/verify-packaged-startup.cjs "dist/win-unpacked/OpenWhispr.exe"

  build-macos:
    needs: quality
    if: needs.quality.outputs.build == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # arch: [x64, arm64]
        arch: [arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Intel macOS packages are no longer built.
      # - name: Install ffmpeg-static for target architecture
      #   if: matrix.arch == 'x64'
      #   run: |
      #     rm -f node_modules/ffmpeg-static/ffmpeg
      #     npm_config_arch=x64 node node_modules/ffmpeg-static/install.js

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: macos-${{ matrix.arch }}-bin-${{ hashFiles('scripts/download-*.js', 'scripts/build-globe-listener.js', 'resources/macos-globe-listener.swift', 'scripts/build-macos-fast-paste.js', 'resources/macos-fast-paste.swift', 'scripts/build-media-remote.js', 'resources/macos-media-remote.swift', 'scripts/build-macos-audio-tap.js', 'resources/macos-audio-tap.swift') }}

      - name: Compile macos-globe-listener binary
        run: npm run compile:globe -- --arch ${{ matrix.arch }}

      - name: Compile macos-fast-paste binary
        run: npm run compile:fast-paste -- --arch ${{ matrix.arch }}

      - name: Test macOS copy and paste keyboard layouts
        run: node --test test/helpers/macosPasteLayout.test.js

      - name: Compile macos-media-remote binary
        run: npm run compile:media-remote -- --arch ${{ matrix.arch }}

      - name: Compile macos-audio-tap binary
        run: npm run compile:audio-tap -- --arch ${{ matrix.arch }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current --platform darwin --arch ${{ matrix.arch }}

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: macos-${{ matrix.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: macos-${{ matrix.arch }}-electron-

      - name: Create runtime env
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env
          echo "SLACK_CLIENT_ID=${{ secrets.SLACK_CLIENT_ID }}" >> .env
          echo "LINEAR_CLIENT_ID=${{ secrets.LINEAR_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_CLIENT_ID=${{ secrets.GH_APP_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_SLUG=${{ secrets.GH_APP_SLUG }}" >> .env

      - name: Build unsigned macOS application (${{ matrix.arch }})
        run: npm run build:mac -- --${{ matrix.arch }} --publish never --config electron-builder.unsigned-mac.json
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          # Forks and Dependabot get no GH_TOKEN; github.token can't read the private font release.
          BRAND_FONTS_REQUIRED: ${{ secrets.GH_TOKEN && '1' || '0' }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.openwhispr.com' }}
          VITE_OPENWHISPR_API_URL: ${{ vars.VITE_OPENWHISPR_API_URL }}
          VITE_OPENWHISPR_OAUTH_CALLBACK_URL: ${{ vars.VITE_OPENWHISPR_OAUTH_CALLBACK_URL }}

      - name: Verify packaged macOS native binaries
        run: |
          APP_PATH=$(ls -d dist/mac*/OpenWhispr.app | head -n1)
          for bin in macos-audio-tap macos-globe-listener macos-fast-paste macos-mic-listener macos-calendar-listener macos-text-monitor macos-window-bounds macos-media-remote; do
            test -x "$APP_PATH/Contents/Resources/bin/$bin" || { echo "Missing in bundle: $bin"; exit 1; }
          done
          test -x "$APP_PATH/Contents/Resources/bin/MediaRemoteAdapter.framework/Versions/A/MediaRemoteAdapter" || { echo "Missing in bundle: MediaRemoteAdapter.framework"; exit 1; }
          test -f "$APP_PATH/Contents/Resources/bin/mediaremote-adapter.pl" || { echo "Missing in bundle: mediaremote-adapter.pl"; exit 1; }
          node scripts/verify-macos-parakeet.js "$APP_PATH"

      - name: Archive macOS app for local signing
        if: github.event_name != 'pull_request'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          APP_PATH=$(find dist -maxdepth 2 -name OpenWhispr.app -type d -print -quit)
          test -n "$APP_PATH" || { echo "Missing packaged OpenWhispr.app"; exit 1; }
          node -e 'const fs = require("fs"); const {execFileSync} = require("child_process"); fs.writeFileSync("dist/release.json", JSON.stringify({version: require("./package.json").version, commit: execFileSync("git", ["rev-parse", "HEAD"], {encoding: "utf8"}).trim(), arch: process.env.TARGET_ARCH}));'
          COPYFILE_DISABLE=1 tar -czf "dist/OpenWhispr-macos-${{ matrix.arch }}-unsigned-app.tar.gz" -C "$(dirname "$APP_PATH")" OpenWhispr.app -C "$GITHUB_WORKSPACE/dist" release.json

      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          # name: macos-${{ matrix.arch }}-unsigned-build
          name: macos-${{ matrix.arch }}-signing-${{ github.run_id }}
          # Archives preserve executable permissions and framework symlinks.
          # The signing script only consumes the tar archive; avoid duplicate app downloads.
          # path: |
          #   dist/*.dmg
          #   dist/*.zip
          #   dist/*-unsigned-app.tar.gz
          path: dist/*-unsigned-app.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Verify packaged macOS startup
        run: node scripts/verify-packaged-startup.cjs "dist/mac-${{ matrix.arch }}/OpenWhispr.app"

  desktop-status:
    name: Desktop CI
    # needs: [changes, quality, build-linux, build-windows, build-macos]
    needs: [changes, quality, build-windows, build-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all selected desktop checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD: ${{ needs.quality.outputs.build }}
          # LINUX_RESULT: ${{ needs.build-linux.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$DESKTOP" = true ]; then
            test "$QUALITY_RESULT" = success
            if [ "$BUILD" = true ]; then
              # test "$LINUX_RESULT" = success
              test "$WINDOWS_RESULT" = success
              test "$MACOS_RESULT" = success
            fi
          fi
