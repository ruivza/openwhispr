name: Sync upstream main

on:
  schedule:
    - cron: "17 20 * * *" # Daily at 20:17 UTC.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ruivza/openwhispr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTREAM_REPOSITORY: OpenWhispr/openwhispr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test synchronization safeguards
        run: node --test .github/scripts/upstream-version.test.cjs .github/scripts/sync-upstream.test.cjs .github/scripts/notify-upstream-sync.test.cjs
      - name: Merge and validate upstream changes
        id: sync
        env:
          UPSTREAM_SYNC_RESULT_PATH: ${{ runner.temp }}/upstream-sync-result.json
          # Most changes work with GITHUB_TOKEN. Updating workflow files may
          # require an optional token limited to this fork, with Contents and
          # Workflows write permissions. Never print either token.
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        # The script keeps fork versions, checks candidates before pushing,
        # and uses [skip ci] commits. It never tags, publishes or dispatches CI.
        run: node .github/scripts/sync-upstream.cjs
      - name: Update synchronization issue
        if: ${{ !cancelled() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure') }}
        env:
          UPSTREAM_SYNC_RESULT_PATH: ${{ runner.temp }}/upstream-sync-result.json
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/notify-upstream-sync.cjs
